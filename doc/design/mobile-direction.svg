<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1000" viewBox="0 0 1120 1000" role="img" aria-labelledby="title desc"><title id="title">VitasMarta: propuesta propia para Android</title><desc id="desc">Dos esquemas de composición: explorar y detalle. Bloques de fotografía y datos marcados como contenido futuro del API. No son capturas de una aplicación.</desc><rect x="0" y="0" width="1120" height="1000" fill="#FFFFFF" rx="0" /><text x="40" y="48" font-family="sans-serif" font-size="30" font-weight="700" fill="#1D2B5C">VitasMarta · Android</text><text x="40" y="79" font-family="sans-serif" font-size="17" font-weight="400" fill="#1D2B5C">Dirección móvil propia · Fase 0 · Propuesta de composición</text><text x="40" y="108" font-family="sans-serif" font-size="15" font-weight="400" fill="#1D2B5C">Esquemas documentales. Las fotos y los datos procederán del API.</text><text x="40" y="150" font-family="sans-serif" font-size="20" font-weight="600" fill="#1D2B5C">Explorar</text><rect x="40" y="170" width="360" height="730" fill="#FDFBFA" rx="24" stroke="#D5DAE3" /><text x="64" y="204" font-family="sans-serif" font-size="13" font-weight="600" fill="#1D2B5C">9:41</text><line x1="56" y1="855" x2="384" y2="855" stroke="#D5DAE3" /><rect x="180" y="881" width="80" height="4" fill="#1D2B5C" rx="2" /><text x="430" y="150" font-family="sans-serif" font-size="20" font-weight="600" fill="#1D2B5C">Detalle</text><rect x="430" y="170" width="360" height="730" fill="#FDFBFA" rx="24" stroke="#D5DAE3" /><text x="454" y="204" font-family="sans-serif" font-size="13" font-weight="600" fill="#1D2B5C">9:41</text><line x1="446" y1="855" x2="774" y2="855" stroke="#D5DAE3" /><rect x="570" y="881" width="80" height="4" fill="#1D2B5C" rx="2" /><text x="64" y="247" font-family="sans-serif" font-size="20" font-weight="700" fill="#1D2B5C">VitasMarta</text><text x="64" y="293" font-family="sans-serif" font-size="30" font-weight="700" fill="#1D2B5C">Santa Marta,</text><text x="64" y="329" font-family="sans-serif" font-size="30" font-weight="700" fill="#1D2B5C">a tu ritmo</text><text x="64" y="364" font-family="sans-serif" font-size="14" font-weight="500" fill="#1D2B5C">Busca una experiencia</text><rect x="64" y="377" width="312" height="56" fill="#FFFFFF" rx="12" stroke="#1D2B5C" /><text x="80" y="412" font-family="sans-serif" font-size="16" font-weight="400" fill="#1D2B5C">¿Qué quieres descubrir?</text><rect x="64" y="450" width="90" height="48" fill="#F4E1DE" rx="24" /><text x="82" y="480" font-family="sans-serif" font-size="15" font-weight="600" fill="#1D2B5C">Todo</text><text x="172" y="480" font-family="sans-serif" font-size="15" font-weight="400" fill="#1D2B5C">Categorías</text><text x="309" y="480" font-family="sans-serif" font-size="15" font-weight="600" fill="#1D2B5C">Filtros</text><rect x="64" y="519" width="312" height="174" fill="#F4E1DE" rx="12" /><line x1="64" y1="641" x2="376" y2="641" stroke="#D5DAE3" /><text x="123" y="598" font-family="sans-serif" font-size="20" font-weight="600" fill="#1D2B5C">Foto del destino</text><text x="141" y="629" font-family="sans-serif" font-size="14" font-weight="400" fill="#1D2B5C">Contenido del API</text><text x="64" y="728" font-family="sans-serif" font-size="22" font-weight="600" fill="#1D2B5C">Nombre del destino</text><text x="64" y="756" font-family="sans-serif" font-size="14" font-weight="400" fill="#1D2B5C">Categoría · si está disponible</text><text x="64" y="788" font-family="sans-serif" font-size="16" font-weight="500" fill="#1D2B5C">Precio real cuando exista</text><line x1="64" y1="814" x2="376" y2="814" stroke="#D5DAE3" /><rect x="53" y="826" width="77" height="25" fill="#F4E1DE" rx="12" /><text x="57" y="844" font-family="sans-serif" font-size="13" font-weight="600" fill="#1D2B5C">Explorar</text><text x="150" y="844" font-family="sans-serif" font-size="13" font-weight="400" fill="#1D2B5C">Reservas</text><text x="246" y="844" font-family="sans-serif" font-size="13" font-weight="400" fill="#1D2B5C">P