nt-weight="400" fill="#1D2B5C">Búsqueda visible</text><text x="835" y="278" font-family="sans-serif" font-size="16" font-weight="400" fill="#1D2B5C">Una columna legible</text><text x="835" y="306" font-family="sans-serif" font-size="16" font-weight="400" fill="#1D2B5C">Fotos protagonistas</text><text x="835" y="334" font-family="sans-serif" font-size="16" font-weight="400" fill="#1D2B5C">Acción junto al pulgar</text><text x="835" y="362" font-family="sans-serif" font-size="16" font-weight="400" fill="#1D2B5C">Reserva paso a paso</text><text x="835" y="390" font-family="sans-serif" font-size="16" font-weight="400" fill="#1D2B5C">Estados sin datos ficticios</text><text x="835" y="451" font-family="sans-serif" font-size="20" font-weight="700" fill="#1D2B5C">Identidad de marca</text><rect x="835" y="479" width="28" height="28" fill="#1D2B5C" rx="6" /><text x="877" y="499" font-family="sans-serif" font-size="15" font-weight="400" fill="#1D2B5C">Azul Tinta</text><rect x="835" y="524" width="28" height="28" fill="#F4E1DE" rx="6" /><text x="877" y="544" font-family="sans-serif" font-size="15" font-weight="400" fill="#1D2B5C">Rosa Niebla</text><rect x="835" y="569" width="28" height="28" fill="#006B3F" rx="6" /><text x="877" y="589" font-family="sans-serif" font-size="15" font-weight="400" fill="#1D2B5C">Esmeralda texto</text><text x="835" y="660" font-family="sans-serif" font-size="16" font-weight="600" fill="#1D2B5C">48dp mínimo táctil</text><text x="835" y="688" font-family="sans-serif" font-size="16" font-weight="400" fill="#1D2B5C">Texto ampliable en sp</text><text x="835" y="716" font-family="sans-serif" font-size="16" font-weight="400" fill="#1D2B5C">Foco y TalkBack</text><text x="835" y="787" font-family="sans-serif" font-size="16" font-weight="600" fill="#1D2B5C">Sin diseño desktop</text><text x="835" y="815" font-family="sans-serif" font-size="16" font-weight="400" fill="#1D2B5C">Sin WebView</text><text x="40" y="947" font-family="sans-serif" font-size="17" font-weight="500" fill="#1D2B5C">Siguiente: validar contratos y entorno antes de implementar la base Kotlin/Compose.</text><text x="40" y="976" font-family="sans-serif" font-size="14" font-weight="400" fill="#1D2B5C">No es una captura. Tipografía de sistema en esta lámina; Poppins prevista en la aplicación.</text></svg>